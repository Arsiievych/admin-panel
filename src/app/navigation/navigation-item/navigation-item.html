<button
  class="item-button"
  type="button"
  [class.is-active]="active"
  [class.is-muted]="muted && !active"
  [attr.aria-current]="active ? 'page' : null"
>
  <span class="item-icon" aria-hidden="true">
    <i [class]="iconClass"></i>
  </span>
  <span class="item-label">{{ label }}</span>
</button>
