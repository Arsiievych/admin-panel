<button
  class="item-button"
  type="button"
  [routerLink]=path
  routerLinkActive="is-active"
  [routerLinkActiveOptions]="{ exact: true }"
  ariaCurrentWhenActive="page"
>
  <span class="item-icon" aria-hidden="true">
    <i [class]="iconClass"></i>
  </span>
  <span class="item-label">{{ label }}</span>
</button>
