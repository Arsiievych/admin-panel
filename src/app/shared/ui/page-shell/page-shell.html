<section class="page-shell" aria-label="Page content shell">
  <header class="page-shell-header">
    <div class="page-shell-heading">
      @if (eyebrow) {
        <p class="page-shell-kicker">{{ eyebrow }}</p>
      }
      <h1 class="page-shell-title">{{ title }}</h1>
      @if (description) {
        <p class="page-shell-description">{{ description }}</p>
      }
    </div>

    <div class="page-shell-actions">
      <ng-content select="[page-shell-actions]"></ng-content>
    </div>
  </header>

  <div class="page-shell-content">
    <ng-content></ng-content>
  </div>
</section>
