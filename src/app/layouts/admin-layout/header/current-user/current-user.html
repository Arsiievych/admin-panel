<section class="current-user" aria-label="Current user">
  <div class="current-user-avatar" aria-hidden="true">{{ initials() }}</div>

  <div class="current-user-details">
    <p class="current-user-name">{{ displayName() }}</p>
    <p class="current-user-role">{{ roleLabel() }}</p>
    <p class="current-user-email">{{ email() }}</p>
  </div>
</section>
