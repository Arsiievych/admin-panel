<section class="chat-widget" aria-label="Admin chat widget">
  <header class="chat-widget-header">
    <div class="chat-widget-heading">
      <p class="chat-widget-kicker">Global Chat</p>
      <p class="chat-widget-subtitle">Incident response room for queue health and moderation updates.</p>
    </div>

    <button class="chat-widget-close" type="button" aria-label="Close chat widget" (click)="close.emit()">
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path d="M7 7l10 10" />
        <path d="M17 7 7 17" />
      </svg>
    </button>
  </header>

  <div class="chat-widget-messages" aria-label="Chat messages" #messagesViewport>
    @for (message of messages(); track message.id) {
      <article class="chat-message" [class.is-own]="message.isOwn">
        <div class="chat-message-card" [class.is-muted]="isMuted(message.userId) && !message.isAdmin && !message.isOwn">
          <div class="chat-message-meta">
            <div class="chat-message-author">
              <span class="chat-message-name">{{ message.userName }}</span>
              <span class="chat-message-role" [class.is-admin]="message.isAdmin">{{ message.role }}</span>
            </div>

            <div class="chat-message-side">
              <time class="chat-message-time">{{ message.time }}</time>

              @if (canMuteMessage(message)) {
                <button
                  class="chat-message-mute-button"
                  type="button"
                  [class.is-muted]="isMuted(message.userId)"
                  [attr.aria-pressed]="isMuted(message.userId)"
                  (click)="toggleMute(message.userId)"
                >
                  {{ isMuted(message.userId) ? 'Muted' : 'Mute' }}
                </button>
              }
            </div>
          </div>

          <p class="chat-message-text">{{ message.message }}</p>
        </div>
      </article>
    }
  </div>

  <form class="chat-widget-compose" (submit)="sendMessage(); $event.preventDefault()">
    <div class="chat-widget-input-shell">
      <textarea
        #composerInput
        class="chat-widget-input"
        rows="2"
        placeholder="Write a message..."
        aria-label="Write a message"
        [value]="draftMessage()"
        (input)="updateDraft($event)"
        (keydown)="handleComposerKeydown($event)"
      ></textarea>

      <button class="chat-widget-send-button" type="submit" aria-label="Send message" [disabled]="!draftMessage().trim()">
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
          <path d="M4 11.75 19.2 5.3c.8-.34 1.6.42 1.31 1.24l-4.18 12.01c-.27.78-1.3.92-1.77.25l-3.12-4.4-4.42-1.1c-.85-.22-.94-1.4-.14-1.75l7.38-3.2" />
          <path d="m20.1 5.63-8.66 8.77" />
        </svg>
      </button>
    </div>
  </form>
</section>
