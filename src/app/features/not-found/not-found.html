<main class="not-found-page">
  <section class="not-found-content" aria-labelledby="not-found-title">
    <p class="not-found-code">404</p>
    <h1 class="not-found-title" id="not-found-title">Page not found</h1>
    <p class="not-found-copy">The page you are looking for does not exist.</p>
    <button class="not-found-button" type="button" (click)="goToDashboard()">
      <span class="not-found-button-icon" aria-hidden="true">
        <i class="fi fi-rr-arrow-left"></i>
      </span>
      <span>Back to dashboard</span>
    </button>
  </section>
</main>
