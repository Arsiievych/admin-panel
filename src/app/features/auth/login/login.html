<main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
        <div class="login-card-content">
            <app-logo/>
            <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
                <label class="login-field">
                    <span class="login-field-label">Email</span>
                    <input
                            class="login-field-input"
                            [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
                            [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
                            type="email"
                            name="email"
                            autocomplete="email"
                            placeholder="admin@example.com"
                            formControlName="email"
                            required
                    />
                    @if (form.controls.email.touched && form.controls.email.hasError('email')) {
                        <span class="login-field-error">Enter a valid email address.</span>
                    }
                </label>

                <label class="login-field">
                    <span class="login-field-label">Password</span>
                    <input
                            class="login-field-input"
                            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
                            [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
                            type="password"
                            name="password"
                            autocomplete="current-password"
                            formControlName="password"
                            placeholder="••••••••••"
                            required
                    />
                    @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
                        <span class="login-field-error">Password must be at least 6 characters.</span>
                    }
                </label>
                <label class="login-remember">
                    <input class="login-remember-input" type="checkbox" name="remember" />
                    <span class="login-remember-box" aria-hidden="true"></span>
                    <span class="login-remember-text">Remember User</span>
                </label>
                @if (errorMessage()) {
                    <p class="login-error">{{ errorMessage() }}</p>
                }
                <app-button class="login-submit" type="submit" [disabled]="isSubmitting()" [fullWidth]="true">
                    {{ isSubmitting() ? 'Logging in...' : 'Login' }}
                </app-button>
            </form>
        </div>
    </section>
</main>
