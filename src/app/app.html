<app-header/>
<div class="app-layout">
    <app-navigation>
        <app-navigation-item navigation-item label="Dashboard" icon="fi-rr-dashboard" [path]="['/dashboard']"/>
        <app-navigation-item navigation-item label="Players" icon="fi-rr-users" [path]="['/players']"/>
        <app-navigation-item navigation-item label="Settings" icon="fi-rr-settings" [path]="['/settings']"/>
    </app-navigation>
    <app-page-shell>
        <router-outlet/>
    </app-page-shell>
</div>

@if (isChatOpen) {
    <app-admin-chat-widget (close)="closeChat()"/>
} @else {
    <app-chat-toggle-button (open)="openChat()"/>
}
