<app-header />
<div class="app-layout">
  <app-navigation>
    <app-navigation-item navigation-item label="Dashboard" icon="fi-rr-dashboard" [active]="true" />
    <app-navigation-item navigation-item label="Players" icon="fi-rr-users" />
    <app-navigation-item navigation-item label="Settings" icon="fi-rr-settings" />
  </app-navigation>

  <app-page-shell title="Dashboard">
    <p class="page-lead">Main content area for charts, reports, and widgets.</p>
  </app-page-shell>
</div>

@if (isChatOpen) {
  <app-admin-chat-widget (close)="closeChat()" />
} @else {
  <app-chat-toggle-button (open)="openChat()" />
}
